# اعتماد التحديث لبقية السيرفرات.
# السيرفر التجريبي يتبع الفرع main ويتحدث وحده بعد كل push (عن طريق Cron عليه).
# بعد التجربة: Actions > Promote to production > Run workflow
# فيُنقل main (أو commit محدد) إلى الفرع production، وتسحبه بقية السيرفرات خلال 5 دقائق.
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'commit محدد (اتركه فارغاً لاعتماد آخر main)'
        required: false

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move production to the approved commit
        env:
          WANTED: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          target=$(git rev-parse --verify "${WANTED:-origin/main}^{commit}")
          if git rev-parse --verify -q origin/production >/dev/null; then
            current=$(git rev-parse origin/production)
            if [ "$current" = "$target" ]; then
              echo "production is already on ${target:0:7}"; exit 0
            fi
            git merge-base --is-ancestor "$current" "$target" \
              || { echo "::error::production فيه commits ليست في هذا الـ commit، لن أرجعه للخلف"; exit 1; }
            echo "Changes going to production:"
            git log --oneline "$current..$target"
          else
            echo "Creating production branch"
          fi
          git push origin "$target:refs/heads/production"
          echo "::notice::production -> $(git log -1 --format='%h %s' "$target"). السيرفرات تتحدث خلال 5 دقائق."
